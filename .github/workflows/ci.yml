name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the engine
        run: pip install -e ".[test]"

      - name: Install Chromium, Ghostscript, and poppler
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ghostscript poppler-utils

      - name: Tests
        run: python -m pytest

      - name: Build every example book in print mode
        run: |
          shopt -s nullglob
          for book in examples/*/; do
            echo "::group::$book"
            cookbook lint --book "$book"
            cookbook index --check --book "$book"
            cookbook fit --book "$book"
            cookbook build --print --book "$book"
            cookbook check --book "$book"
            cookbook audit --book "$book"
            cookbook cover --book "$book"
            echo "::endgroup::"
          done

      # A brand-new book, a few recipes, a clean press run, no engine edits.
      - name: A new book prints with no engine edits
        run: |
          book="$RUNNER_TEMP/new-book"
          cookbook init --book "$book" --categories mains,desserts \
            --title "Test Kitchen" --subtitle "A Two-Recipe Book"
          mkdir -p "$book/book/recipes/mains/skillet-cornbread" "$book/book/recipes/desserts/baked-apples"
          cat > "$book/book/recipes/mains/skillet-cornbread/recipe.md" <<'EOF'
          # Skillet Cornbread

          *Ruth Baker*

          ## Ingredients

          - 1 cup cornmeal
          - 1 cup flour
          - 1 cup buttermilk
          - 1 egg
          - 2 tablespoons butter

          ## Directions

          1. Heat the oven to 425°F with the butter in a cast-iron skillet.
          2. Stir the rest together and pour it into the hot skillet.
          3. Bake until golden, about 20 minutes.
          EOF
          cat > "$book/book/recipes/desserts/baked-apples/recipe.md" <<'EOF'
          # Baked Apples

          *Tom Baker*

          ## Ingredients

          - 4 apples, cored
          - 1/4 cup brown sugar
          - 1 teaspoon cinnamon

          ## Directions

          1. Fill the apples with the sugar and cinnamon.
          2. Bake at 350°F until tender, about 40 minutes.
          EOF
          # init's placeholders are lint errors until the pages are written.
          if cookbook lint --book "$book"; then echo "lint passed init's placeholders" >&2; exit 1; fi
          printf '*For everyone who ever asked for the recipe.*\n' > "$book/book/sections/matter-dedication/page.md"
          printf '*Add your own on the blank pages.*\n' > "$book/book/sections/matter-closing-message/page.md"
          printf '*Supper, most nights.*\n' > "$book/book/sections/mains/page.md"
          printf '*Sunday afternoons.*\n' > "$book/book/sections/desserts/page.md"
          printf '# Back Cover\n\nTwo recipes from the Baker kitchen.\n\n*The Bakers*\n' > "$book/book/cover.md"
          cookbook lint --book "$book"
          cookbook press --book "$book"
          test -s "$book/draft/cookbook-interior-press.pdf"
          test -s "$book/draft/cookbook-cover.pdf"

      # install.sh from this checkout, with no terminal: defaults, no key.
      - name: install.sh sets up a book that is ready to print
        run: |
          COOKBOOK_PACKAGE="$PWD" bash install.sh "$RUNNER_TEMP/installed-book" </dev/null
          cd "$RUNNER_TEMP/installed-book"
          ./cookbook doctor
          test -f book/book.yaml
          git init -q && git check-ignore -q .env

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Ghostscript's installer has no unattended mode, so a person clicks
      # through it; here Chocolatey installs it, and install.ps1 finds it under
      # Program Files and skips that step.
      - name: Install Ghostscript
        shell: powershell
        run: choco install ghostscript -y --no-progress

      # Windows PowerShell 5.1, the one every Windows has, running the script the
      # way `irm ... | iex` does: defaults, no key.
      - name: install.ps1 sets up a book that is ready to print
        shell: powershell
        env:
          COOKBOOK_PACKAGE: ${{ github.workspace }}
          COOKBOOK_DIR: ${{ runner.temp }}\installed-book
          COOKBOOK_ASSUME_DEFAULTS: "1"
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          Set-Location $env:COOKBOOK_DIR
          ./cookbook doctor   # as the README writes it
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path book\book.yaml)) { exit 1 }

      - name: Tests
        shell: powershell
        run: |
          python -m pip install --quiet -e ".[test]"
          python -m playwright install chromium
          python -m pytest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The installed book prints
        shell: powershell
        run: |
          Set-Location "$env:RUNNER_TEMP\installed-book"
          function Write-Utf8($path, $text) {
            New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
            [System.IO.File]::WriteAllText((Join-Path $PWD $path), $text)
          }
          Write-Utf8 book\recipes\mains\skillet-cornbread\recipe.md "# Skillet Cornbread`n`n*Ruth Baker*`n`n## Ingredients`n`n- 1 cup cornmeal`n- 1 cup flour`n- 1 cup buttermilk`n- 1 egg`n- 2 tablespoons butter`n`n## Directions`n`n1. Heat the oven to 425 degrees with the butter in a cast-iron skillet.`n2. Stir the rest together and pour it into the hot skillet.`n3. Bake until golden, about 20 minutes.`n"
          Write-Utf8 book\recipes\desserts\baked-apples\recipe.md "# Baked Apples`n`n*Tom Baker*`n`n## Ingredients`n`n- 4 apples, cored`n- 1/4 cup brown sugar`n- 1 teaspoon cinnamon`n`n## Directions`n`n1. Fill the apples with the sugar and cinnamon.`n2. Bake at 350 degrees until tender, about 40 minutes.`n"
          Write-Utf8 book\sections\matter-dedication\page.md "*For everyone who ever asked for the recipe.*`n"
          Write-Utf8 book\sections\matter-closing-message\page.md "*Add your own on the blank pages.*`n"
          foreach ($chapter in 'breakfast', 'mains', 'sides', 'desserts') {
            Write-Utf8 "book\sections\$chapter\page.md" "*From the Baker kitchen.*`n"
          }
          Write-Utf8 book\cover.md "# Back Cover`n`nTwo recipes from the Baker kitchen.`n`n*The Bakers*`n"
          $yaml = Get-Content book\book.yaml -Raw
          [System.IO.File]::WriteAllText((Join-Path $PWD book\book.yaml), $yaml.Replace('TODO: the family name', 'The Bakers'))
          .\cookbook.cmd lint
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\cookbook.cmd press
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ((Test-Path draft\cookbook-interior-press.pdf) -and (Test-Path draft\cookbook-cover.pdf))) { exit 1 }

      # What `cookbook doctor` tells a Windows user to run for poppler: does it
      # put pdftoppm where the engine looks?
      - name: Poppler from winget
        continue-on-error: true
        shell: powershell
        run: |
          winget install -e --id oschwartz10612.Poppler --accept-package-agreements --accept-source-agreements --disable-interactivity
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links" -ErrorAction SilentlyContinue | Select-Object Name
          [Environment]::GetEnvironmentVariable('Path', 'User')
